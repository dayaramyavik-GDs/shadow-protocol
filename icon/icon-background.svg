<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- Adaptive-icon background layer: night tower, cyan core glow, red embers below. -->
  <defs>
    <radialGradient id="core" cx="54" cy="50" r="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#145566" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#0b2533" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#050912" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx="54" cy="104" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4a3a" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#b3201b" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#3a0808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd3e6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5fd3e6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" fill="#050912"/>
  <!-- distant surveillance screens -->
  <g fill="url(#screen)">
    <rect x="2" y="14" width="13" height="10"/><rect x="3" y="28" width="12" height="9"/><rect x="1" y="41" width="14" height="11"/>
    <rect x="93" y="12" width="13" height="10"/><rect x="94" y="26" width="12" height="10"/><rect x="93" y="40" width="14" height="11"/>
  </g>
  <g fill="#e5483f" opacity="0.5">
    <rect x="5" y="47" width="6" height="1.4"/><rect x="96" y="46" width="7" height="1.4"/>
  </g>
  <rect width="108" height="108" fill="url(#core)"/>
  <rect width="108" height="108" fill="url(#ember)"/>
  <!-- targeting rings on the floor -->
  <g fill="none" stroke="#ff5a48" stroke-opacity="0.35" stroke-width="0.6">
    <ellipse cx="54" cy="98" rx="34" ry="7"/>
    <ellipse cx="54" cy="98" rx="22" ry="4.5"/>
    <ellipse cx="54" cy="98" rx="10" ry="2"/>
  </g>
</svg>
